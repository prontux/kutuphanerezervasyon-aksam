
name: Otomatik Rezervasyon

on:
  schedule:
    - cron: '20 20 * * *'
  workflow_dispatch:

jobs:
  rezervasyon-yap:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Kodları çek
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Chrome ve Tesseract kur
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser tesseract-ocr

      - name: Python kütüphanelerini kur
        run: |
          python -m pip install --upgrade pip
          pip install opencv-python-headless pillow selenium pytesseract

      - name: Scripti çalıştır
        env:
          TZ: Europe/Istanbul
          PYTHONUNBUFFERED: "1"
          TC_KIMLIK: ${{ secrets.TC_KIMLIK }}
          SIFRE: ${{ secrets.SIFRE }}
        run: python -u rezervasyon.py
